name: 台股日報

on:
  schedule:
    - cron: "0 9 * * 1-5"   # UTC 09:00 = 台灣平日 17:00（GitHub 排程可能晚幾分鐘到半小時）
  workflow_dispatch:          # 可以在 Actions 頁面手動按「Run workflow」測試

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas yfinance

      - name: 產生日報並推播
        run: python tw_market_daily.py --today-only
        env:
          REPORT_DIR: docs
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PAGES_URL: ${{ vars.PAGES_URL }}

      - name: 存回 GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs history.csv || true
          git diff --cached --quiet || git commit -m "日報 $(TZ=Asia/Taipei date +%F)"
          git push
