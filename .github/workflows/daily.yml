name: 台股日報

on:
  schedule:
    # 主力由 cron-job.org 在台灣 17:15 觸發；這裡是備援（台灣 18:37），今天跑過就會自動跳過
    - cron: "37 10 * * 1-5"
  workflow_dispatch:          # 可以在 Actions 頁面手動按「Run workflow」測試
    inputs:
      date:
        description: "測試用日期 YYYYMMDD（留空 = 今天）"
        required: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas yfinance

      - name: 產生日報並推播
        run: |
          if [ -n "$TEST_DATE" ]; then
            python tw_market_daily.py --date "$TEST_DATE"
          else
            python tw_market_daily.py --today-only
          fi
        env:
          TEST_DATE: ${{ inputs.date }}
          REPORT_DIR: docs
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PAGES_URL: ${{ vars.PAGES_URL }}

      - name: 存回 GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs history.csv || true
          git diff --cached --quiet || git commit -m "日報 $(TZ=Asia/Taipei date +%F)"
          git push
